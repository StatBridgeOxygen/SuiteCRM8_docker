name: Build And Push Suite CRM

concurrency:
  cancel-in-progress: false
  group: production

env:
  TAG: production

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          tags: |
            registry.stat-bridge.com/suitecrm
          outputs: type=docker,dest=/tmp/api.tar

      - name: Docker login
        run: docker login --username registry --password ${{ secrets.DOCKER_PASSWORD }} registry.stat-bridge.com

      - name: Strapi push
        run: docker push registry.stat-bridge.com/suitecrm
